name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: binary (${{ matrix.rid }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained
        run: >
          dotnet publish src/AmlMcp -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o publish/${{ matrix.rid }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath aml-mcp-${{ matrix.rid }}.zip
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf aml-mcp-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} .
      - uses: actions/upload-artifact@v4
        with:
          name: aml-mcp-${{ matrix.rid }}
          path: aml-mcp-${{ matrix.rid }}.*

  package:
    name: nuget package
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pack
        run: dotnet pack src/AmlMcp -c Release -o nupkg --nologo
      # The tag has to match the package version, or v0.2.0 would publish a 0.1.0 package.
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "nupkg/AutomationML.McpServer.${version}.nupkg" || { ls nupkg; echo "no package for version ${version}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            nupkg/*.nupkg
            nupkg/*.snupkg

  plugin:
    # The AutomationML Editor panel, Windows only, with the server packed into it.
    name: editor plugin
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pack the server into the plugin
        run: ./plugin/publish-server.ps1
        shell: pwsh
      - name: Build the plugin
        run: dotnet build plugin/AmlMcp.Editor.sln -c Release --nologo
      - uses: actions/upload-artifact@v4
        with:
          name: editor-plugin
          path: build/Plugins/**/*.nupkg

  plugin-nuget:
    # The AutomationML Editor finds plugins on nuget.org by the tag AMLEditorPlugin.Net, so this
    # is how an editor user installs it. Trusted publishing: no key is stored here. Switched on
    # with the repository variable PUBLISH_PLUGIN_TO_NUGET once the policy exists on nuget.org.
    name: nuget.org (editor plugin)
    needs: plugin
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_PLUGIN_TO_NUGET == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: editor-plugin
          path: plugin-package
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push the plugin
        run: >
          dotnet nuget push "plugin-package/**/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  nuget:
    # Trusted publishing: GitHub proves the workflow's identity (OIDC) and nuget.org hands out
    # a short-lived key, so no API key is stored here. A version on nuget.org cannot be
    # replaced, so the environment can require an approval before this job runs.
    name: nuget.org
    needs: package
    # Switched on with the repository variable PUBLISH_TO_NUGET once the trusted publishing
    # policy exists on nuget.org and NUGET_USER is set. Until then a tag builds everything
    # and publishes the GitHub release, without a red run.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_NUGET == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          # nuget.org account (profile name, not e-mail) that owns the trusted publishing policy.
          user: ${{ vars.NUGET_USER }}
      - name: Push the package
        run: >
          dotnet nuget push "nupkg/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  release:
    name: github release
    needs: [ binaries, package, plugin ]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.nupkg
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **aml-mcp**, the server: take the archive for your platform, unpack it, run `aml-mcp`.
            **Aml.Editor.Plugin.AmlMcp.<version>.nupkg**: the AutomationML Editor panel. Add the folder
            holding it as a source in the PlugIn Manager and install "AmlMcp" from there. It carries the
            server, so nothing else has to be installed.

            On macOS the downloaded binary is quarantined, because it is not signed or notarised.
            Clear the attribute once after unpacking:

                xattr -d com.apple.quarantine aml-mcp

  # Switched off, and never run: the registry checks the io.github.hsu-aut namespace against
  # the GitHub repository and downloads the package from nuget.org, so both have to exist
  # first. Enable by setting the repository variable PUBLISH_TO_MCP_REGISTRY to "true".
  mcp-registry:
    name: mcp registry
    needs: nuget
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_MCP_REGISTRY == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" \
            | tar xz mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
