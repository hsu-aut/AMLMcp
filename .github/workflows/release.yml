name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

# Two tags pushed in quick succession must not overwrite each other's release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: binary (${{ matrix.rid }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained
        run: >
          dotnet publish src/AmlMcp -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o publish/${{ matrix.rid }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath aml-mcp-${{ matrix.rid }}.zip
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf aml-mcp-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} .
      - uses: actions/upload-artifact@v4
        with:
          name: aml-mcp-${{ matrix.rid }}
          path: aml-mcp-${{ matrix.rid }}.*

  package:
    name: nuget package
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # The key is read here, at job level, so that the push step can ask whether it is set:
    # the secrets context is not available in a step's `if`, the env context is.
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pack
        run: dotnet pack src/AmlMcp -c Release -o nupkg --nologo
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            nupkg/*.nupkg
            nupkg/*.snupkg
      - name: Push to NuGet
        if: startsWith(github.ref, 'refs/tags/v') && env.NUGET_API_KEY != ''
        run: dotnet nuget push nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Say why nothing was pushed
        if: startsWith(github.ref, 'refs/tags/v') && env.NUGET_API_KEY == ''
        run: echo "::warning::NUGET_API_KEY is not configured, the package was built but not published."

  release:
    name: github release
    needs: [ binaries, package ]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.nupkg
          generate_release_notes: true
          body: |
            On macOS the downloaded binary is quarantined, because it is not signed or notarised.
            Clear the attribute once after unpacking:

                xattr -d com.apple.quarantine aml-mcp

  # Switched off, and never run: the registry checks the io.github.hsu-aut namespace against
  # the GitHub repository and downloads the package from nuget.org, so both have to exist
  # first. Enable by setting the repository variable PUBLISH_TO_MCP_REGISTRY to "true".
  mcp-registry:
    name: mcp registry (disabled until PUBLISH_TO_MCP_REGISTRY=true)
    needs: [ package ]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_MCP_REGISTRY == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # the OIDC token that proves this workflow runs in the hsu-aut namespace
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" \
            | tar xz mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
