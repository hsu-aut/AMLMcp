name: build and test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macOS is in the matrix because the release ships two macOS binaries.
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: dotnet build AmlMcp.sln -c Release --nologo
      - name: Test
        run: dotnet test AmlMcp.sln -c Release --nologo --no-build
      - name: Smoke test over the protocol
        shell: bash
        run: python test/smoke.py examples/plant.aml
      - name: Pack
        run: dotnet pack src/AmlMcp -c Release -o nupkg --nologo

  metadata:
    name: packaging metadata
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the validator
        run: pip install --disable-pip-version-check jsonschema
      # Validates both server.json files against the schema they declare, checks that they
      # are byte-identical, and that their version matches the version the project builds
      # with (MSBuild PackageVersion, written once in Directory.Build.props).
      - name: Check server.json and the version
        run: python .github/scripts/check-metadata.py
